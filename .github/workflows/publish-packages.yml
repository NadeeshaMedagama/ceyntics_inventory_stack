# ============================================================
# Publish Docker Images to GitHub Packages (GHCR)
# ============================================================
# Builds and pushes Docker images to GitHub Container Registry
# on pushes to main branch and on version tags.
# ============================================================

name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "Publish ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - service: user-service
            context: ./services/user-service
            dockerfile: ./services/user-service/Dockerfile
          - service: inventory-service
            context: ./services/inventory-service
            dockerfile: ./services/inventory-service/Dockerfile
          - service: borrow-service
            context: ./services/borrow-service
            dockerfile: ./services/borrow-service/Dockerfile
          - service: audit-service
            context: ./services/audit-service
            dockerfile: ./services/audit-service/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ceyntics-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

