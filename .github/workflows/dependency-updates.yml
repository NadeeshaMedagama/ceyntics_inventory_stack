# ============================================================
# Dependency Updates Check
# ============================================================
# Checks for outdated dependencies across all services and
# the frontend. Runs weekly and can be triggered manually.
# ============================================================

name: Dependency Updates

on:
  schedule:
    # Run every Wednesday at 08:00 UTC
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ─────────────────────────────────────────────
  # Check Frontend (npm) Dependencies
  # ─────────────────────────────────────────────
  check-frontend:
    name: "Frontend — npm Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: List outdated packages
        run: npm outdated || true

  # ─────────────────────────────────────────────
  # Check Backend (Composer) Dependencies
  # ─────────────────────────────────────────────
  check-backend:
    name: "Backend — Composer Audit (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - inventory-service
          - borrow-service
          - audit-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-interaction --prefer-dist

      - name: Run Composer audit
        if: hashFiles('composer.json') != ''
        run: composer audit
        continue-on-error: true

      - name: List outdated packages
        if: hashFiles('composer.json') != ''
        run: composer outdated --direct || true

  # ─────────────────────────────────────────────
  # Create Summary Issue
  # ─────────────────────────────────────────────
  create-summary:
    name: "Create Summary"
    runs-on: ubuntu-latest
    needs: [check-frontend, check-backend]
    if: always()

    steps:
      - name: Create issue on failure
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            const title = `🔄 Dependency Update Required — ${new Date().toISOString().split('T')[0]}`;
            const body = `## Dependency Update Check Failed\n\nOne or more dependency checks found issues.\n\n**Workflow Run:** [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n### Action Required\n- Review the workflow logs for outdated or vulnerable dependencies\n- Update dependencies and test thoroughly\n- Create a PR with the updates`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dependencies', 'automated']
            });
