events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────
    # Upstream Microservices
    # ─────────────────────────────────────────
    upstream auth_service {
        server auth-service:8000;
    }

    upstream user_service {
        server user-service:8000;
    }

    upstream inventory_service {
        server inventory-service:8000;
    }

    upstream borrow_service {
        server borrow-service:8000;
    }

    upstream audit_service {
        server audit-service:8000;
    }

    # ─────────────────────────────────────────
    # Rate Limiting
    # ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ─────────────────────────────────────────
    # Server Configuration
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ──── Auth Service Routes ────
        location /api/v1/auth/ {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── User Service Routes ────
        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Inventory Service Routes ────
        location ~ ^/api/v1/(cupboards|places|items) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10M;
        }

        # ──── Borrow Service Routes ────
        location /api/v1/borrow-records {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://borrow_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──── Audit Service Routes ────
        location /api/v1/audit-logs {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://audit_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 '{"status":"ok","gateway":"ceyntics-api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
